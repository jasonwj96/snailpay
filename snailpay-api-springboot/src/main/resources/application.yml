spring:
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

snailpay:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  verification:
    hmac-secret: ${VERIFICATION_HMAC_SECRET}
  mail:
    from: no-reply@snailpay.com
  kyc:
    bucket: ${KYC_BUCKET}
    region: ${AWS_REGION:us-east-1}
    kms-key-arn: ${KYC_KMS_KEY_ARN}
    tin-index-secret: ${KYC_TIN_INDEX_SECRET}
    disclosure-version: "2026-11-02"