<form class="flex flex-col items-stretch gap-4" (submit)="onSubmit($event)">
  <div class="flex flex-row gap-4">
    <div class="flex flex-col items-start gap-1 flex-1">
      <label class="text-[13px] font-medium text-text">First name</label>
      <input
        class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
        type="text" placeholder="John" [formField]="personalInfoForm.firstName" />
    </div>

    <div class="flex flex-col items-start gap-1 flex-1">
      <label class="text-[13px] font-medium text-text">Middle name (optional)</label>
      <input
        class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
        type="text" placeholder="James" [formField]="personalInfoForm.middleName" />
    </div>
  </div>

  <div class="flex flex-row gap-4">
    <div class="flex flex-col items-start gap-1 flex-1">
      <label class="text-[13px] font-medium text-text">Last name</label>
      <input
        class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
        type="text" placeholder="Doe" [formField]="personalInfoForm.lastName" />
    </div>

    <div class="flex flex-col items-start gap-1 w-[100px]">
      <label class="text-[13px] font-medium text-text">Suffix</label>
      <input
        class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
        type="text" placeholder="Jr." [formField]="personalInfoForm.suffix" />
    </div>
  </div>

  <div class="flex flex-col items-start gap-1">
    <label class="text-[13px] font-medium text-text">Email</label>
    <input
      class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
      type="email" placeholder="jasonwj96@snailpay.com" [formField]="personalInfoForm.email" />
  </div>

  <div class="flex flex-col items-start gap-1">
    <label class="text-[13px] font-medium text-text">Phone</label>
    <input
      class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
      type="tel" placeholder="+50761234567" [formField]="personalInfoForm.phone" />
  </div>

  <div class="flex flex-col items-start gap-1">
    <label class="text-[13px] font-medium text-text">Date of birth</label>
    <input
      class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
      type="date" [formField]="personalInfoForm.dateOfBirth" />
  </div>

  @if (submitError()) {
    <p class="text-xs text-red-500">{{ submitError() }}</p>
  }

  <button
    class="w-full py-3 bg-primary text-white border-none rounded-sm text-sm font-medium cursor-pointer transition-colors hover:bg-primary-dark disabled:opacity-50 disabled:cursor-not-allowed"
    type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Creating account…' : 'Continue' }}
  </button>

  <p class="text-xs text-text-muted text-center">
    By continuing you agree to our
    <a href="/terms" class="text-primary hover:underline">Terms</a> and
    <a href="/privacy" class="text-primary hover:underline"> Privacy Policy</a>
  </p>
</form>
