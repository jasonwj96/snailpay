<div>
  <div class="flex items-center justify-center w-full h-[150px]">
    <img src="/snailpay-logo-full.svg" width="175" height="150" alt="Snailpay logo" priority />
  </div>

  <div class="flex flex-col items-start gap-2 mb-6">
    <h1 class="text-[22px] font-semibold text-text">Create your account</h1>
    <p class="text-sm text-text-muted">
      Already have an account?
      <a href="/login" class="text-primary hover:underline">Log in</a>
    </p>
  </div>

  <!-- Step indicator: driven entirely by stepIndices (sized off
       wizard.totalSteps), so a new step added to WIZARD_STEPS shows up
       here automatically with no template changes. -->
  <div class="flex flex-row items-center gap-2 mb-6" role="list" aria-label="Registration progress">
    @for (i of stepIndices; track i) {
      <div
        role="listitem"
        [attr.aria-current]="i === wizard.currentStepIndex() ? 'step' : null"
        class="flex-1 h-1 rounded-sm transition-colors"
        [class.bg-primary]="i <= wizard.currentStepIndex()"
        [class.bg-border]="i > wizard.currentStepIndex()"
      ></div>
    }
  </div>

  @switch (wizard.currentStepId()) {
    @case ('personal-info') {
      <app-personal-info-step />
    }
    @case ('verification') {
      <app-verification-step />
    }
    @case ('kyc') {
      <!-- TODO: KYC step — out of scope for now -->
      <p class="text-sm text-text-muted">KYC step coming soon.</p>
    }
  }
</div>
