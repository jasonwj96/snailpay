<div>
  <div class="flex items-center justify-center w-full h-[150px]">
    <img src="/snailpay-logo-full.svg" width="175" height="150" alt="Snailpay logo" />
  </div>

  <div class="flex flex-col items-start gap-2 mb-6">
    <h1 class="text-[22px] font-semibold text-text">Welcome back</h1>
    <p class="text-sm text-text-muted">
      Don't have an account?
      <a href="/register" class="text-primary hover:underline">Sign up</a>
    </p>
  </div>

  <form class="flex flex-col items-stretch gap-4" (submit)="onSubmit($event)">
    <div class="flex flex-col items-start gap-1">
      <label class="text-[13px] font-medium text-text">Email</label>
      <input
        class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
        type="email" placeholder="jason@cloudbank.dev" [value]="loginModel().email"
        (input)="updateEmail($any($event.target).value)" />
    </div>

    <div class="flex flex-col items-start gap-1">
      <div class="flex flex-row items-center justify-between w-full">
        <label class="text-[13px] font-medium text-text">Password</label>
        <a href="/forgot-password" class="text-xs text-text-muted hover:text-primary">
          Forgot password?
        </a>
      </div>
      <input
        class="w-full px-3 py-2 bg-bg border border-border rounded-sm text-text text-sm outline-none transition-colors focus:border-primary placeholder:text-text-muted"
        type="password" placeholder="••••••••" [value]="loginModel().password"
        (input)="updatePassword($any($event.target).value)" />
    </div>

    <button
      class="w-full py-3 bg-primary text-white border-none rounded-sm text-sm font-medium cursor-pointer transition-colors hover:bg-primary-dark"
      type="submit">
      Log in
    </button>

    <p class="text-xs text-text-muted text-center">
      By logging in you agree to our
      <a href="/terms" class="text-primary hover:underline">Terms</a> and
      <a href="/privacy" class="text-primary hover:underline"> Privacy Policy</a>
    </p>
  </form>
</div>
