@if (logoSrc(); as logo) {
  <div class="flex items-center justify-center w-full h-[150px]">
    <img [src]="logo" width="175" height="150" alt="Logo" />
  </div>
}

<div class="flex flex-col items-start gap-2 mb-6">
  @if (heading(); as title) {
    <h1 class="text-[22px] font-semibold text-text">{{ title }}</h1>
  }
  <ng-content select="[wizard-subtitle]" />
</div>

<div class="flex flex-row items-center gap-2 mb-6" role="list" aria-label="Progress">
  @for (s of steps(); track s.id) {
    <div
      role="listitem"
      [attr.aria-current]="$index === stepIndex() ? 'step' : null"
      class="flex-1 h-1 rounded-sm transition-colors"
      [class.bg-primary]="$index <= stepIndex()"
      [class.bg-border]="$index > stepIndex()"
    ></div>
  }
</div>

@if (step(); as current) {
  <ng-container *ngComponentOutlet="current.component" />
}
