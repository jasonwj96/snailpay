<div class="flex flex-row items-center gap-2 mb-6" role="list" aria-label="Progress">
  @for (s of steps(); track s.id) {
    <div
      role="listitem"
      [attr.aria-current]="$index === stepIndex() ? 'step' : null"
      class="flex-1 h-1 rounded-sm transition-colors"
      [class.bg-primary]="$index <= stepIndex()"
      [class.bg-border]="$index > stepIndex()"
    ></div>
  }
</div>

@if (step(); as current) {
  <ng-container *ngComponentOutlet="current.component" />
}
