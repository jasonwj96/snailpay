<!-- Step indicator: numbered circles joined by a line, label underneath. -->
<ol class="mx-auto mb-8 flex w-full max-w-[760px]" aria-label="Progress">
  @for (step of steps(); track step.id) {
    @let isDone = $index < currentStepIndex();
    @let isCurrent = $index === currentStepIndex();

    <li
      class="relative flex flex-1 flex-col items-center"
      [attr.aria-current]="isCurrent ? 'step' : null"
    >
      <!-- Line to the next step, drawn from this circle's center to the next one's -->
      @if (!$last) {
        <span
          class="absolute left-1/2 top-4 -mt-px h-0.5 w-full transition-colors"
          [class.bg-primary]="isDone"
          [class.bg-border]="!isDone"
          aria-hidden="true"
        ></span>
      }

      <!-- Circle -->
      <span
        class="relative z-10 flex h-8 w-8 items-center justify-center rounded-full border-2 text-sm font-semibold transition-colors"
        [class.border-primary]="isDone || isCurrent"
        [class.bg-primary]="isDone || isCurrent"
        [class.text-white]="isDone || isCurrent"
        [class.border-border]="!isDone && !isCurrent"
        [class.bg-bg]="!isDone && !isCurrent"
        [class.ring-4]="isCurrent"
        [class.ring-primary/20]="isCurrent"
      >
        @if (isDone) {
          <svg viewBox="0 0 20 20" class="h-4 w-4" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 10.5l4 4 8-9" />
          </svg>
          <span class="sr-only">Completed:</span>
        } @else {
          {{ $index + 1 }}
        }
      </span>

      <!-- Name: always visible for the current step; others hide on tiny screens -->
      <span
        class="mt-2 text-center text-xs leading-tight"
        [class.font-semibold]="isCurrent"
        [class.opacity-60]="!isCurrent && !isDone"
        [class.hidden]="!isCurrent"
        [class.sm:block]="!isCurrent"
      >
        {{ step.label }}
      </span>
    </li>
  }
</ol>

@if (currentStepComponent(); as current) {
  <ng-container *ngComponentOutlet="current.component" />
}
